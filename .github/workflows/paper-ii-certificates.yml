name: Paper II certificates

on:
  push:
    branches: [main, paper-ii-draft]
    paths: ['paper-ii/**', '.github/workflows/paper-ii-certificates.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    name: Arb certificates for the heat endpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --requirement paper-ii/requirements.txt
      - name: Replay and compare
        working-directory: paper-ii
        run: |
          set -euo pipefail
          mkdir committed && cp heat-upper-bounds.json heat-sharpness.json committed/
          python certify_bounds.py | tee bounds.log
          python certify_sharp.py | tee sharp.log
          python check_d3.py | tee d3.log
          python check_export.py | tee export.log
          python integer/upper.py | tee integer-upper.log
          python integer/sharp.py | tee integer-sharp.log
          cmp heat-upper-bounds.json committed/heat-upper-bounds.json
          cmp heat-sharpness.json committed/heat-sharpness.json
          tail -n 1 bounds.log | grep -qx OK
          tail -n 1 sharp.log | grep -qx OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ii-evidence
          path: |
            paper-ii/*.log
            paper-ii/*.json
          retention-days: 90
