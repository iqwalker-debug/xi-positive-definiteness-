name: Mathematical Verification

on:
  push:
    branches: [main, verification-ci, tidal-xi-certificate]
    paths: ['verification/**', '.github/workflows/mathematical-verification.yml']
  pull_request:
    branches: [main]
    paths: ['verification/**', '.github/workflows/mathematical-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arb:
    name: Arb interval certificates (D9 and D10)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bits: [192, 256]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned python-flint
        run: python -m pip install --requirement verification/arb/requirements.txt
      - name: Verify radial signs
        working-directory: verification/arb
        env:
          ARB_BITS: ${{ matrix.bits }}
        run: |
          set -o pipefail
          python certify.py 2>&1 | tee arb-run.log
          python certify_d9_cells.py --bits "$ARB_BITS" --check-lean ../lean/D9Coverage.lean | tee -a arb-run.log
          python certify_d9_cells.py --verify "d9-certificate-$ARB_BITS.json" | tee -a arb-run.log
          python certify_finite.py --bits "$ARB_BITS" --output "d10-rows-$ARB_BITS.json" --check-lean ../lean/D10Rows.lean | tee -a arb-run.log
          python certify_finite_d10.py "$ARB_BITS" | tee arb-finite-d10.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arb-${{ matrix.bits }}-evidence
          path: |
            verification/arb/arb-run.log
            verification/arb/arb-results.json
            verification/arb/arb-finite-d10.json
            verification/arb/d9-certificate-*.json
            verification/arb/d10-rows-*.json
          if-no-files-found: warn
          retention-days: 90

  lean:
    name: Lean theorem and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Elan
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lean and Mathlib
        working-directory: verification/lean
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
      - name: Compile lemma and inspect axioms
        working-directory: verification/lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          modules=(AxiomDraft D9Coverage D9Fourier D9Mellin ThetaSeries ThetaCosine ThetaJets PositiveWalk XiProfile XiCutoff D9DirectSigns D10Rows XiStrict)
          for module in "${modules[@]}"; do
            lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean" 2>&1 | tee -a lean-run.log
          done
          grep -F "'GenesisTidalMellin.exact_cutoff_of_arb' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-run.log
          grep -F "'GenesisTidalMellin.strict_d9' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-run.log
          grep -F "'GenesisTidalMellin.strict_cutoff_of_arb' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-run.log
          grep -F "'GenesisTidalMellin.exact_cutoff_of_row_bounds' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-run.log
          if grep -Eq 'sorryAx|declaration uses .sorry.' lean-run.log; then
            echo "Unproved declaration found"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(axiom|constant)[[:space:]]' *.lean; then
            echo "Additional axiom declaration found"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-evidence
          path: |
            verification/lean/lean-run.log
            verification/lean/lean-toolchain
            verification/lean/lake-manifest.json
          if-no-files-found: warn
          retention-days: 90
